              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Doctor Registration Successful
        '422':
          description: Doctor Registration - Invalid Token
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 07:20:45 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '97'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                    format: style
              example:
                error: Invalid Token
                message: 'The authorization token has: Not enough segments.'
      tags:
        - Login-Registration-Auth-API
      security:
        - BearerAuth: []
      description: |-
        ## Purpose

        Registers a new doctor account by the admin only in the HMS app.

        ## Responses

        All possible reponses from this endpoint:

        - **201 - Created**
            
        - **400 - Bad Request**
            
        - **401 - Unauthorized**
            
        - **403 - Forbidden**
            
        - **409 - Conflict**
            
        - **422 - Unprocessable**
            
        - **500 - Internal Server Error**
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                gender:
                  type: string
                license:
                  type: string
                qualification:
                  type: string
                department_id:
                  type: integer
                specialization_id:
                  type: integer
                experience:
                  type: integer
                description:
                  type: string
                contact:
                  type: string
                  format: utc-millisec
            example:
              full_name: Dr Das
              email: Das34.hjk@example.com
              password: dcW8765#
              gender: Male
              license: M-786
              qualification: MBBs
              department_id: 2
              specialization_id: 1
              experience: 80
              description: >-
                Dr. Das is a qualified and compassionate General Physician with
                experience in diagnosing and treating a wide range of acute and
                chronic medical conditions. They provide comprehensive primary
                healthcare, focusing on preventive care, accurate diagnosis, and
                personalized treatment plans.
              contact: '1234567809'
