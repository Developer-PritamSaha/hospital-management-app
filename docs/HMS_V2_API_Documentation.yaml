openapi: 3.0.0
info:
  title: HMS-V2-API-Documentation
  version: 1.0.0
  description: >-
    This API documentation will make you famialarize with the overall design of
    the Hospital Management SYstem application and how to interact with its
    different resources.

  contact:
    name: API support - Developer Pritam
    url: https://github.com/23f1002917

servers:
  - url: http://127.0.0.1:5080

paths:
  /api:
    get:
      summary: HMS-API
      responses:
        '200':
          description: HMS-API Success
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 05:40:18 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '57'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Hospital Management System Api is Running.
        '500':
          description: HMS-API Failed
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              schema:
                type: string
              example: Sun, 08 Mar 2026 05:43:59 GMT
            Content-Length:
              schema:
                type: integer
              example: '40'
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: The server faced an error
      tags:
        - Index-API
      description: >-
        ## Purpose


        Health-check / index endpoint for the HMS app. Use this request to
        verify the API server is reachable and responding.


        ## Responses


        All possible reponses from this endpoint:


        - **200 - OK**.
            
        - **500 - Internal Server Error** .
  /api/login:
    post:
      summary: Login Api
      responses:
        '200':
          description: Login Api - Success
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 07:27:45 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '795'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
              example:
                access_token: >-
                  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..tpcgLKVctmlbPzlT1uLrQdTNARIXkTXaHIYnKhPx6Ao
                refresh_token: >-
                  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6ZmFsc2UsImlhdCI6MTc3Mjk1NDg2NSwianRpIjoiNDI5MjVlYmUtNjYyNi00YWVmLTkwOGMtMDNmMDBmYmFiMjgzIiwidHlwZSI6InJlZnJlc2giLCJzdWIiOiIxIiwibmJmIjoxNzcyOTU0ODY1LCJjc3JmIjoiYzM5N2Y5N2QtN2RhNS00N2M2LWFhYjYtZWM2YWVhN2Q2ZjM1IiwiZXhwIjoxNzc1NTQ2ODY1fQ.hpb77naA-ZKTWscXyeDKopQ0aNnc2Y1rSXE0Lf-3JoY
        '404':
          description: Login Api - Not found
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 07:24:31 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '39'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: User do not exist
      tags:
        - Login-Registration-Auth-API
      description: |-
        ## Purpose

        Sends JWT access and refresh token after a successfull login.

        ## Responses

        All possible reponses from this endpoint:

        - **200 - OK**
            
        - **400 - Bad Request**
            
        - **401 - Unauthorized**
            
        - **404 - Not Found**
            
        - **500 - Internal Server Error**
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                rememberMe:
                  type: boolean
            example:
              email: admin.66e54e@example.com
              password: 4AF+fdL1
              rememberMe: true
  /api/register/patient:
    post:
      summary: Patient Resgistration
      responses:
        '201':
          description: Patient Resgistration Success
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 07:00:47 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '47'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Patient Registration Successful
        '400':
          description: Patient Resgistration Bad
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 07:15:20 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '44'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Only JSON data allowed
        '409':
          description: Patient Resgistration Conflict
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              schema:
                type: string
              example: Sun, 08 Mar 2026 07:12:36 GMT
            Content-Length:
              schema:
                type: integer
              example: '49'
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Patient email already exist
        '500':
          description: Patient Resgistration Failed
          headers:
            Server:
              deprecated: false
              schema: {}
              example: Werkzeug/3.1.3 Python/3.10.12
            Date:
              deprecated: false
              schema: {}
              example: Sun, 08 Mar 2026 07:14:50 GMT
            Content-Length:
              deprecated: false
              schema: {}
              example: '49'
            Access-Control-Allow-Origin:
              deprecated: false
              schema: {}
              example: '*'
            Connection:
              deprecated: false
              schema: {}
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Patient Registration failed
      tags:
        - Login-Registration-Auth-API
      description: |-
        ## Purpose

        Registers a new **patient** account in the HMS app.

        ## Responses

        All possible reponses from this endpoint:

        - **201 - Created**
            
        - **400 - Bad Request**
            
        - **409 - Conflict**
            
        - **500 - Internal Server Error**
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: "{\r\n    \"full_name\": \"Dev Pritam\",\r\n    \"email\": \"Prit@example.com\",\r\n    \"password\": \"Pgh56#89\",\r\n    \"contact\": \"1234567809\",\r\n    \"dob\": \"2004-05-09\", //'YYYY-MM-DD'\r\n    \"gender\": \"male\",\r\n    \"height_cm\": 167,\r\n    \"weight_kg\": 100\r\n}"
  /api/register/doctor:
    post:
      summary: Doctor Registration
      responses:
        '201':
